version: "3.9"

services:
  task_a:
    build:
      context: ./task_a
      dockerfile: Dockerfile
    container_name: bct_task_a
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  task_b:
    build:
      context: ./task_b
      dockerfile: Dockerfile
    container_name: bct_task_b
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped